<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>ZombieLauncher Admin</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="admin-window">

<h1>ZombieLauncher 관리자</h1>

<div class="admin-box">

<label>Discord 주소</label>

<input
id="discord"
placeholder="https://discord.gg/"
>

<label>뉴스</label>

<textarea
id="news"
placeholder="런처 뉴스 입력"
></textarea>

<label>공지</label>

<textarea
id="notice"
placeholder="공지 입력"
></textarea>

<hr>

<h2>📦 모드 업로드</h2>

<button id="uploadMod">
모드 선택 및 업로드

</button>

<div id="modList"></div>

<hr>

<h2>🎨 쉐이더 업로드</h2>

<button id="uploadShader">
쉐이더 선택 및 업로드

</button>

<div id="shaderList"></div>

<hr>

<h2>🖼 리소스팩 업로드</h2>

<button id="uploadResourcepack">
리소스팩 선택 및 업로드

</button>

<div id="resourcepackList"></div>

<hr>

<div class="admin-actions">

<button id="save-btn">

💾 저장

</button>

<button id="close-btn">

닫기

</button>

</div>

</div>

</div>

<script src="admin.js"></script>

</body>

</html>
